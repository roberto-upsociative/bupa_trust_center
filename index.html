<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Área do cliente | Trust Center</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar"><a class="brand" href="#" aria-label="Página inicial"><span class="brand-mark">T</span><span>Trust Center</span></a><span class="environment">HOMOLOGAÇÃO</span></header>
      <section class="card" aria-labelledby="page-title">
        <div class="eyebrow">ÁREA DO CLIENTE</div>
        <h1 id="page-title">Acesse suas preferências de privacidade</h1>
        <p class="intro">Informe seu RUT para continuar ao Trust Center.</p>
        <form id="rut-form">
          <label for="rut">RUT</label>
          <input id="rut" name="rut" type="text" autocomplete="username" placeholder="Digite seu RUT" required />
          <button class="primary" type="submit">Acessar</button>
        </form>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <section id="trust-section" class="trust-section" hidden>
          <div class="section-heading"><div><div class="eyebrow">PREFERÊNCIAS DE PRIVACIDADE</div><h2>Trust Center</h2></div></div>
          <div id="trust-center-host"></div>
        </section>
        <p class="privacy-note">Seu RUT será usado para identificar seu perfil no Trust Center.</p>
      </section>
      <footer>Ambiente de homologação</footer>
    </main>
  </body>
</html>
