<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Área de clientes | Trust Center</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar"><a class="brand" href="index.html" aria-label="Página de inicio"><span class="brand-mark">T</span><span>Trust Center</span></a><span class="environment">PRUEBAS</span></header>
      <section class="card" aria-labelledby="page-title">
        <div class="eyebrow">ÁREA DE CLIENTES</div>
        <h1 id="page-title">Accede a tus preferencias de privacidad</h1>
        <p class="intro">Ingresa tu RUT para acceder a tus preferencias de privacidad.</p>
        <form id="rut-form">
          <label for="rut">RUT</label>
          <input id="rut" name="rut" type="text" autocomplete="username" placeholder="Ingresa tu RUT" required />
          <button class="primary" type="submit">Continuar</button>
        </form>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <p class="privacy-note">Usaremos tu RUT para identificar tu perfil en Trust Center.</p>
      </section>
      <footer>Entorno de pruebas</footer>
    </main>
  </body>
</html>
